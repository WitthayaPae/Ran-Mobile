#  Compile the client for iOS on a hosted Mac.
#
#  There is no Mac on the development machine, so this runner IS the compiler:
#  it is what turns every file under native/platform/ios/ from "written against
#  the documented API" into "known to build". Run it, read the errors, fix them
#  here, run it again.
#
#  It does NOT sign and does NOT produce an installable build. Signing needs an
#  Apple developer identity, and putting a build on a device needs that identity
#  or a sideloading tool. Compiling needs neither.
#
#  Cost: macOS minutes bill at 10x on a private repository, so this is
#  deliberately manual (workflow_dispatch) plus a push filter narrow enough that
#  an Android-only change does not spend anything.
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/platform/ios/**'
      - 'native/shim/**'
      - 'native/CMakeLists.txt'
      #  The iOS bundle version is read out of this file by CMakeLists.txt
      #  (RAN_PRODUCT_VERSION = 1.0.<android versionCode>), and the version
      #  is bumped by MAKE-PATCH *after* the code was pushed. Without this
      #  line the .ipa keeps the old number, which is the number already on
      #  the phone, and AltStore never offers the update. It cost two
      #  releases before it was noticed.
      - 'native/android/AndroidManifest.xml'
      - 'native/build-ios.sh'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-14           #  Xcode 15, iOS 17 SDK, arm64 runner
    steps:
      - name: Check out MOBILE
        uses: actions/checkout@v4
        with:
          path: MOBILE

      #  The client source is a separate repository, and CMake expects it as a
      #  sibling: RAN_SRC is ${CMAKE_CURRENT_SOURCE_DIR}/../../SOURCE.
      - name: Check out SOURCE
        uses: actions/checkout@v4
        with:
          repository: WitthayaPae/RAN-ASURA-SOURCE
          #  main. The port branch used to carry 49 Visual Studio caches (a 186 MB
          #  Browse.VC.db, a dozen 150-190 MB .ipch) that GitHub refuses, so this built a
          #  squashed copy on ci/ios-source. They were stripped from the history and
          #  .vs/ is ignored (2026-09-15), so main is pushed and built directly.
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: SOURCE

      #  ccache, because macOS minutes bill at 10x on a private repository and
      #  this job recompiled the entire client - a thousand-odd translation
      #  units - from scratch every run, at about twelve minutes each. A change
      #  to one file has no business costing that.
      #
      #  The cache key changes every run so the entry is always rewritten with
      #  what this run compiled; restore-keys is what actually finds the
      #  previous one. That is the documented way to keep a rolling cache.
      - name: Cache the compiler output
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ios-ccache-${{ github.sha }}
          restore-keys: |
            ios-ccache-

      - name: Install ccache
        run: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          ccache --max-size=2G
          ccache --zero-stats

      - name: Show the toolchain
        run: |
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version

      #  Device slice, arm64, no signing. CODE_SIGNING_ALLOWED=NO is what lets a
      #  runner with no identity finish the link.
      - name: Configure and build
        working-directory: MOBILE/native
        run: |
          chmod +x build-ios.sh
          #  RelWithDebInfo, not Release: a crash report off the phone gives a
          #  symbol and an offset, and without DWARF that is where the trail
          #  ends - EXC_BREAKPOINT in SANIMCONINFO::operator= named the function
          #  and nothing about which line. Same optimisation plus line tables, so
          #  llvm-symbolizer turns an offset into a file and a line.
          #
          #  The comment lives HERE and not among the arguments: a backslash
          #  continuation followed by a comment ends the command, and the next
          #  line ran as one of its own - "-DCMAKE_BUILD_TYPE=RelWithDebInfo:
          #  command not found", exit 127.
          cmake -S . -B out/ios -G "Unix Makefiles" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          #  pipefail, or the job passes whatever the compiler did: the exit
          #  status of "cmake --build | tee" is tee's, which is always 0. The
          #  first run reported success on a build that died at 1%.
          set -o pipefail
          cmake --build out/ios -j "$(sysctl -n hw.ncpu)" 2>&1 | tee build.log

      #  Whether the cache is actually earning its keep. A hit rate near zero
      #  means the key or the compiler line changed and the run cost full price.
      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      #  The whole point on a first run: the errors, kept even when the build
      #  fails, so they can be worked through on the development machine.
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: MOBILE/native/build.log

      #  An .ipa is a zip with the bundle under Payload/, and that is the only
      #  shape Sideloadly, AltStore and Xcode will take. Unsigned: signing needs
      #  an Apple identity, and the sideloader supplies one from the machine it
      #  runs on. Producing it here means the install is a download and a drag,
      #  rather than a repack the person doing it has to get right.
      #  dsymutil, because RelWithDebInfo on its own gives nothing off-device.
      #
      #  Apple's linker does not put DWARF in the executable: it leaves it in the
      #  .o files and writes a debug map of N_OSO entries pointing at them. The
      #  binary that comes back from this runner therefore has zero __DWARF
      #  sections and four stale paths - checked, not assumed. dsymutil is what
      #  walks that map and collects the DWARF into one bundle, and only then can
      #  llvm-symbolizer turn a crash offset into a file and a line.
      - name: Collect the debug info
        if: success()
        working-directory: MOBILE/native/out/ios
        run: |
          dsymutil ran.app/ran -o ran.dSYM
          du -sh ran.dSYM

      - name: Keep the debug info
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ran-ios-dsym
          path: MOBILE/native/out/ios/ran.dSYM

      - name: Wrap the bundle as an .ipa
        if: success()
        working-directory: MOBILE/native/out/ios
        run: |
          mkdir -p Payload
          cp -R ran.app Payload/
          zip -qry RanLegacyM-unsigned.ipa Payload
          ls -la RanLegacyM-unsigned.ipa

      - name: Keep the app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ran-ios-unsigned
          path: |
            MOBILE/native/out/ios/ran.app
            MOBILE/native/out/ios/RanLegacyM-unsigned.ipa
